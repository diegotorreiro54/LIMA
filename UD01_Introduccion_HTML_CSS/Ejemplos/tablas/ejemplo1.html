<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de tabla básica</title>
</head>
<body>
    <table border="1">
        <caption>Este es el título de la tabla</caption>
        <thead>
            <!--Filas que forman parte del encabezado de la tabla-->
            <tr>
                <th scope="col">Encabezado columna 1</th>
                <th scope="col">Encabezado columna 2</th>
                <th scope="col">Encabezado columna 3</th>
            </tr>
        </thead>
        <tbody>
            <!--Filas que forman parte del cuerpo de la tabla-->
            <tr>
                <th>Esto encabeza una fila y es correcto</th>
                <td>Esto es un dato</td>
                <td>Esto es otro dato</td>
            </tr>
        </tbody>
        <tfoot>
            <!--Filas que forman parte al pie de la tabla-->
        </tfoot>
    </table>
</body>
</html>
